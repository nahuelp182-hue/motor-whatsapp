name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # El secreto se expone como env del job porque el contexto `secrets` NO se puede usar en
    # un `if:` de step: GitHub lo rechaza al parsear y el workflow entero deja de correr.
    # Vía `env` sí funciona, y de paso el paso que lo usa no necesita declararlo de nuevo.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # No bloquea todavía: hay errores preexistentes (setState en efectos, <a> en vez de
      # next/link) en código que no forma parte de este arreglo. Bloquear el merge por ellos
      # ahora frenaría CADA PR, no solo los que tocan esos archivos. Sacar `continue-on-error`
      # cuando se limpien — hasta entonces esto solo avisa.
      - name: Lint
        run: npx eslint .
        continue-on-error: true

      # Compara la base real contra el schema declarado y REPORTA la diferencia.
      #
      # NO bloquea todavía, y el motivo importa: al 27/07/2026 hay drift preexistente que
      # este trabajo no introdujo y que no se puede cerrar sin el Bloque C —
      #   · 5 tablas que viven solo en producción (ig_diag, wa_procesado, claude_usage,
      #     radar_snapshot, radar_youtube), creadas a mano fuera de Prisma;
      #   · gads_cache, también creada a mano: columnas nullable y default de uuid;
      #   · Widget.updatedAt y una FK de Review con defaults distintos.
      # Con eso, un check bloqueante quedaría rojo SIEMPRE, y un CI que siempre está rojo se
      # ignora entero: arrastraría a los checks de typecheck y tests, que sí sirven.
      #
      # Cuando el Bloque C adopte esas tablas, sacar `continue-on-error` y esto pasa a ser la
      # red que impide que vuelva a aparecer una tabla fuera del schema.
      #
      # Si DATABASE_URL no está cargado como secret, el paso se saltea en vez de fallar por un
      # problema de configuración del CI y no del código.
      # Cargarlo en: Settings → Secrets and variables → Actions → New repository secret.
      - name: Drift de migraciones (informativo)
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma
